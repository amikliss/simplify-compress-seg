model: 'swinunetr'
# variables effected by dataset
out_channels: 4
checkpoint_dir: '../results/modelsMNM'
checkpoint_path: "../results/modelsMNM/model-swinunetr_2025-06-12-16-25.ckpt"
# model-swinunetr_2025-06-05-17-01.ckpt" # small version
#"../results/modelsMNM/model-swinunetr_2025-05-16-18-01.ckpt" # challenge split
